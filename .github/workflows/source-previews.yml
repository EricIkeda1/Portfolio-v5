name: Repository and document previews
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['scripts/previews/**', '.github/workflows/source-previews.yml']
permissions:
  contents: write
concurrency:
  group: project-previews
  cancel-in-progress: false
jobs:
  capture:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: stable
          cache: true
      - name: Prepare public source copies
        run: |
          mkdir -p preview-sources
          git clone --depth 1 https://github.com/EricIkeda1/Ademiconnect.git preview-sources/ademiconnect
          git clone --depth 1 https://github.com/EricIkeda1/X4Glass.git preview-sources/x4
          git clone --depth 1 https://github.com/EricIkeda1/Projeto_Arquitetura_de_Software.git preview-sources/architecture
          python scripts/previews/prepare-manager.py
          cp "$FLUTTER_ROOT/bin/cache/artifacts/material_fonts/MaterialIcons-Regular.otf" preview-sources/ademiconnect/Mobile/test/MaterialIcons-Regular.otf
          cp scripts/previews/ademiconnect_test.dart preview-sources/ademiconnect/Mobile/test/portfolio_preview_test.dart
          cp "$FLUTTER_ROOT/bin/cache/artifacts/material_fonts/Roboto-Regular.ttf" preview-sources/ademiconnect/Mobile/test/Roboto-Regular.ttf
          printf '' > preview-sources/ademiconnect/Mobile/.env
      - name: Render real Flutter widget
        working-directory: preview-sources/ademiconnect/Mobile
        run: |
          flutter pub get
          flutter test --update-goldens test/portfolio_preview_test.dart
      - name: Prepare document and repository previews
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          pip install 'Django==5.2.8' 'plotly==5.24.1' 'pandas==2.2.3'
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium
          python scripts/previews/prepare-sources.py
          python -m http.server 8765 --bind 127.0.0.1 --directory preview-sources/rendered > /tmp/preview-server.log 2>&1 &
          node scripts/previews/capture-local.mjs
      - name: Save previews
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/project-previews
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Add real mobile, Django and document previews'
          git -c http.extraheader="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)" push origin HEAD:main

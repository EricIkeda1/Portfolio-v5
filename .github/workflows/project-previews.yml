name: Real project previews
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/capture-project-previews.mjs
      - .github/workflows/project-previews.yml
permissions:
  contents: write
concurrency:
  group: project-previews
  cancel-in-progress: false
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --package-lock=false playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: node scripts/capture-project-previews.mjs
      - name: Save real previews
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/project-previews
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Update real project screenshots'
          git -c http.extraheader="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)" push origin HEAD:main
